name: Bazel CI/CD

on:
  push:
    branches:
      - "*"
  pull_request:
  schedule:
    # Run nightly at 2 AM UTC
    - cron: '0 2 * * *'

# Cancel in-progress runs for the same workflow + branch combination
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-build-test-unix:
    name: Bazel ${{ matrix.bazel }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15]
        bazel: ['7.x', '8.x', '9.x']
    runs-on: ${{ matrix.os }}
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-version: '1.x'
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      
      - name: Build cpu_profiler
        run: bazel build --verbose_failures @gperftools//:cpu_profiler
      
      - name: Build tcmalloc
        run: bazel build --verbose_failures @gperftools//:tcmalloc
      
      - name: Build tcmalloc_minimal
        run: bazel build --verbose_failures @gperftools//:tcmalloc_minimal
      
      - name: Build all targets
        run: bazel build --verbose_failures //...
        continue-on-error: true
      
      - name: Run tests
        run: bazel test --test_output=errors --verbose_failures //...
        continue-on-error: true
      
      - name: Query test targets
        run: bazel query 'tests(//...)' || echo "No test targets found"
        continue-on-error: true

  bazel-build-test-windows:
    name: Bazel ${{ matrix.bazel }} on Windows
    strategy:
      fail-fast: false
      matrix:
        bazel: ['7.x', '8.x', '9.x']
    runs-on: windows-2022
    env:
      USE_BAZEL_VERSION: ${{ matrix.bazel }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-version: '1.x'
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows-${{ matrix.bazel }}
          repository-cache: true
      
      - name: Build tcmalloc
        run: bazel build --verbose_failures @gperftools//:tcmalloc
      
      - name: Build tcmalloc_minimal
        run: bazel build --verbose_failures @gperftools//:tcmalloc_minimal
        continue-on-error: true
      
      - name: Build Windows-compatible targets
        shell: bash
        run: |
          bazel query 'kind("cc_library", //...) except attr("target_compatible_with", "NON_WINDOWS", //...)' | xargs bazel build --verbose_failures || echo "Some targets failed"
        continue-on-error: true
      
      - name: Run tests
        shell: bash
        run: bazel test --test_output=errors --verbose_failures //... || echo "Some tests failed"
        continue-on-error: true
