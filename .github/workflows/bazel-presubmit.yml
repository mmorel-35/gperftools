name: Bazel Presubmit

on:
  push:
    branches:
      - "*"
  pull_request:

# Cancel in-progress runs for the same workflow + branch combination
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  bazel-unix:
    name: Bazel ${{ matrix.bazel }} on ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-20.04, ubuntu-latest, macos-13, macos-latest]
        bazel: ['7.x', '8.x', '9.x']
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-version: '1.x'
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-${{ matrix.os }}-${{ matrix.bazel }}
          repository-cache: true
      
      - name: Configure Bazel version
        run: echo "${{ matrix.bazel }}" > .bazelversion
      
      - name: Build cpu_profiler
        run: bazel build --verbose_failures @gperftools//:cpu_profiler
      
      - name: Build tcmalloc
        run: bazel build --verbose_failures @gperftools//:tcmalloc
      
      - name: Run basic tests (if available)
        run: |
          bazel test --test_output=errors @gperftools//:tcmalloc_minimal_test 2>/dev/null || echo "Tests not available or failed"
        continue-on-error: true

  bazel-windows:
    name: Bazel ${{ matrix.bazel }} on Windows
    strategy:
      fail-fast: false
      matrix:
        bazel: ['7.x', '8.x', '9.x']
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Setup Bazel
        uses: bazel-contrib/setup-bazel@0.9.0
        with:
          bazelisk-version: '1.x'
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-windows-${{ matrix.bazel }}
          repository-cache: true
      
      - name: Configure Bazel version
        shell: bash
        run: echo "${{ matrix.bazel }}" > .bazelversion
      
      - name: Build tcmalloc
        run: bazel build --verbose_failures @gperftools//:tcmalloc
      
      - name: Run basic tests (if available)
        shell: bash
        run: |
          bazel test --test_output=errors @gperftools//:tcmalloc_minimal_test 2>/dev/null || echo "Tests not available or failed"
        continue-on-error: true
